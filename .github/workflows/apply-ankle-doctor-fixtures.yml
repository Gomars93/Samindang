name: Apply ANKLE_FOOT doctor fixtures

on:
  push:
    branches:
      - clinical/ankle-foot-v1-review
    paths:
      - .github/workflows/apply-ankle-doctor-fixtures.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clinical/ankle-foot-v1-review
          fetch-depth: 0
      - name: Add fixtures and integrated DoctorView regression
        run: |
          python - <<'PY'
          from pathlib import Path

          fp = Path('src/doctor/fixtures.ts')
          s = fp.read_text()
          if "발목 통증 주호소 (ANKLE_FOOT, 안전)" not in s:
              insert = r'''
  // ANKLE_FOOT_V1: valid-negative ankle route -> CLEAR.
  buildFixture('발목 통증 주호소 (ANKLE_FOOT, 안전)', {
    ID_01: '김도윤',
    ID_03: 'male',
    BIRTH_01: '19920517',
    VISIT_01: 'symptom',
    VISIT_02_SYMPTOM_MAIN: 'pain',
    VISIT_03_SYMPTOM_DURATION: 'within_1w',
    VISIT_04_SYMPTOM_IMPACT: 'mild',
    SECONDARY_01: ['none'],
    SAFETY_01: ['none'],
    PAIN_01: 'leg_foot',
    PAIN_02: ['aching', 'movement_related'],
    PAIN_04: 'none',
    AF_00: 'ANKLE',
    AF_01: 'NO',
    AF_02: ['NONE'],
    AF_06: 'NO_CONCERN',
    AF_08: 'NO',
  }),

  // A5 OR semantics: pop alone -> REVIEW + Achilles assessment + expedited, not urgent.
  buildFixture('발목뒤 통증 주호소 (ANKLE_FOOT, 아킬레스 확인)', {
    ID_01: '이준호',
    ID_03: 'male',
    BIRTH_01: '19891203',
    VISIT_01: 'symptom',
    VISIT_02_SYMPTOM_MAIN: 'pain',
    VISIT_03_SYMPTOM_DURATION: 'within_1w',
    VISIT_04_SYMPTOM_IMPACT: 'severe',
    SECONDARY_01: ['none'],
    SAFETY_01: ['none'],
    PAIN_01: 'leg_foot',
    PAIN_02: ['sharp', 'movement_related'],
    PAIN_04: 'none',
    AF_00: 'HEEL_POSTERIOR_ANKLE',
    AF_01: 'YES',
    AF_02: ['NONE'],
    AF_03: 'CAN_WALK_NORMALLY',
    AF_05: ['SUDDEN_POP_OR_SNAP_BEHIND_ANKLE_OR_CALF'],
    AF_06: 'NO_CONCERN',
    AF_08: 'NO',
  }),

  // A2 limb-threatening/open injury -> URGENT and StaffCheck.
  buildFixture('발 통증 주호소 (ANKLE_FOOT, 긴급 확인)', {
    ID_01: '박민석',
    ID_03: 'male',
    BIRTH_01: '19850720',
    VISIT_01: 'symptom',
    VISIT_02_SYMPTOM_MAIN: 'pain',
    VISIT_03_SYMPTOM_DURATION: 'within_1w',
    VISIT_04_SYMPTOM_IMPACT: 'severe',
    SECONDARY_01: ['none'],
    SAFETY_01: ['none'],
    PAIN_01: 'leg_foot',
    PAIN_02: ['sharp'],
    PAIN_04: 'none',
    AF_00: 'FOOT_TOES',
    AF_01: 'YES',
    AF_02: ['SEVERE_OPEN_INJURY_OR_BONE_EXPOSURE'],
    AF_03: 'CAN_WALK_BUT_MARKED_DIFFICULTY',
    AF_04: ['NONE'],
    AF_06: 'NO_CONCERN',
    AF_08: 'NO',
  }),
'''
              idx = s.rfind('\n]')
              if idx < 0:
                  raise SystemExit('fixtures closing anchor not found')
              s = s[:idx] + '\n' + insert + s[idx:]
              fp.write_text(s)

          tp = Path('tests/doctor.spec.mjs')
          t = tp.read_text()
          if 'ANKLE_FOOT integrated DoctorView regression' not in t:
              block = r'''

/* ---------------------------------------------------------------------
 * 15. ANKLE_FOOT integrated DoctorView regression.
 * ------------------------------------------------------------------- */
{
  const f = byName('발목 통증 주호소 (ANKLE_FOOT, 안전)')
  assert('ANKLE_FOOT clear: routing detail is ANKLE_FOOT', f.payload.routing.primary_module_detail === 'ANKLE_FOOT')
  assert('ANKLE_FOOT clear: safety payload is CLEAR', f.payload.responses.safety_flags.ankle_foot?.ankle_foot_safety_status === 'CLEAR')
  const html = renderDoctorView('발목 통증 주호소 (ANKLE_FOOT, 안전)')
  assert('ANKLE_FOOT clear: integrated DoctorView renders panel', html.includes('안전 확인 — 발목/발(ANKLE/FOOT)'))
  assert('ANKLE_FOOT clear: no automated Ottawa result leaks', !/Ottawa positive|Ottawa negative/.test(html))
}

{
  const f = byName('발목뒤 통증 주호소 (ANKLE_FOOT, 아킬레스 확인)')
  const af = f.payload.responses.safety_flags.ankle_foot
  assert('ANKLE_FOOT Achilles: REVIEW_REQUIRED', af?.ankle_foot_safety_status === 'REVIEW_REQUIRED')
  assert('ANKLE_FOOT Achilles: assessment flag set', af?.achilles_rupture_assessment_required === true)
  assert('ANKLE_FOOT Achilles: expedited flag set', af?.expedited_referral_consider === true)
  assert('ANKLE_FOOT Achilles: no immediate StaffCheck for non-urgent review', f.payload.flags.requires_staff_check === false)
  const html = renderDoctorView('발목뒤 통증 주호소 (ANKLE_FOOT, 아킬레스 확인)')
  assert('ANKLE_FOOT Achilles: clinician Thompson boundary rendered', html.includes('Thompson test'))
}

{
  const f = byName('발 통증 주호소 (ANKLE_FOOT, 긴급 확인)')
  assert('ANKLE_FOOT urgent: status URGENT_REVIEW', f.payload.responses.safety_flags.ankle_foot?.ankle_foot_safety_status === 'URGENT_REVIEW')
  assert('ANKLE_FOOT urgent: StaffCheck required', f.payload.flags.requires_staff_check === true)
  const html = renderDoctorView('발 통증 주호소 (ANKLE_FOOT, 긴급 확인)')
  assert('ANKLE_FOOT urgent: integrated panel renders urgent wording', html.includes('긴급 확인 필요'))
  assert('ANKLE_FOOT chart boundary: no definitive fracture diagnosis generated', !html.includes('골절 확진'))
}
'''
              anchor = "console.log(`\\n${passCount} assertions passed, 0 failed (total ${passCount})`)"
              if anchor not in t:
                  raise SystemExit('doctor.spec console anchor not found')
              t = t.replace(anchor, block + '\n' + anchor, 1)
              tp.write_text(t)
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet -- src/doctor/fixtures.ts tests/doctor.spec.mjs; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/doctor/fixtures.ts tests/doctor.spec.mjs
          git commit -m "test(clinical): integrate ANKLE_FOOT DoctorView fixtures"
          git push origin HEAD:clinical/ankle-foot-v1-review
