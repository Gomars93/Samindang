name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build (tsc -b && vite build)
        run: npm run build

      - name: Run JS/TS test suite
        run: npm run test:all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: pip install pytest pyyaml

      - name: Run tablet core Python tests
        run: python -m pytest "tablet core/tests" -q