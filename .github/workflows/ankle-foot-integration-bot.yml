name: ANKLE_FOOT one-shot integration

on:
  push:
    branches: [clinical/ankle-foot-v1-review]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clinical/ankle-foot-v1-review
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply guarded core integration codemod
        run: |
          python scripts/integrate-ankle-foot.py
          python scripts/fix-ankle-integration-test.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Full JS/TS regression
        run: npm run test:all
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/spec/coreSpec.ts src/spec/ankleFootAdapter.ts tests/integration.spec.mjs
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
          else
            git commit -m "feat(clinical): integrate ANKLE_FOOT_V1 core flow"
            git push origin HEAD:clinical/ankle-foot-v1-review
          fi
